name: release

# ONE-TIME registry setup before the FIRST real publish:
#
#   1. Bootstrap (token): crates.io has no "pending publisher" concept and
#      trusted publishing can only be attached to a crate that ALREADY exists, so
#      the very first publish of `cardanowall-cli` must use a token. Set the
#      CARGO_REGISTRY_TOKEN repository secret to a crates.io API token with
#      publish-new + publish-update scopes; the publish step prefers it when set.
#
#   2. Trusted Publisher (OIDC): once the crate exists, add a Trusted Publisher on
#      the `cardanowall-cli` crate (crates.io → crate → Settings → Trusted
#      Publishing) with these EXACT fields:
#         Owner             : cardanowall
#         Repository        : label-309-cli
#         Workflow filename : release.yml
#      crates.io has NO organizations — ownership is per-crate. Then clear the
#      CARGO_REGISTRY_TOKEN secret; the crates-io-auth-action step below mints a
#      short-lived token from this job's OIDC identity instead.
#
# This crate depends on the `cardanowall` SDK crate (label-309-rs). The two
# release in lockstep from tags pushed at the same moment, so the publish job
# polls the crates.io index until the SDK version matching this tag is live
# before gating and publishing. Everything downstream of publish — the prebuilt
# binaries, the GitHub Release, the GHCR image — compiles against that
# published SDK, which is why those jobs run only on a real version tag and
# never on a workflow_dispatch dry-run.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (cargo publish --dry-run; skip the real publish — binaries, Release, and image are tag-only)'
        required: false
        default: 'false'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Gates + crates.io publish --------------------------------------------
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token is required for crates.io Trusted-Publisher OIDC.
      id-token: write
    env:
      # The `secrets` context cannot be referenced from an `if:` condition, so the
      # optional bootstrap token is surfaced as env (empty unless the secret is set).
      BOOTSTRAP_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6

      # Fail before any toolchain work if the pushed tag disagrees with the
      # crate manifest: a mistagged commit must never publish, and every
      # downstream asset stamps this version into its file name.
      - name: Assert the tag matches the crate version
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag v$tag_version does not match the Cargo.toml package version $crate_version"
            exit 1
          fi
          echo "tag v$tag_version matches Cargo.toml"

      - name: Derive release metadata
        id: meta
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # ---- Wait for the SDK crate to be live on crates.io ----------------------
      # In the coordinated release, label-309-rs publishes `cardanowall` and this
      # repo publishes `cardanowall-cli` from tags pushed at the same moment, so
      # the two release workflows race. This crate pins `cardanowall = "=<version>"`
      # from crates.io, so BOTH the gate build below and the publish step need the
      # SDK already in the registry index. Poll the sparse index — the exact source
      # cargo resolves against — until the matching version appears (up to ~15
      # minutes), then fail loudly with a re-run hint instead of erroring deep in a
      # compile. Tag-push only: a workflow_dispatch dry-run carries no release
      # version and skips this.
      - name: Wait for `cardanowall` SDK on crates.io
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://index.crates.io/ca/rd/cardanowall"
          echo "Waiting for cardanowall@$version on the crates.io index..."
          for attempt in $(seq 1 90); do
            if curl -fsSL "$url" | grep -q '"vers":"'"$version"'"'; then
              echo "cardanowall@$version is live (after $attempt check(s)); brief grace pause before publish."
              sleep 15
              exit 0
            fi
            echo "  check $attempt/90: not in the index yet; sleeping 10s..."
            sleep 10
          done
          echo "::error::cardanowall@$version did not reach crates.io within ~15 min - label-309-rs may still be running or failed; re-run this workflow once the SDK is published."
          exit 1

      # ---- Reconcile the lockfile with the published SDK -----------------------
      # The SDK releases in lockstep with this CLI, so a freshly tagged tree can
      # carry a Cargo.lock whose `cardanowall` entry does not satisfy the exact
      # registry pin in Cargo.toml — either it still lacks its registry source +
      # checksum (those exist only once the SDK is published), or it is a stale
      # registry entry for an older SDK version. In exactly those cases run
      # cargo's conservative resolve (`cargo fetch`): it keeps every locked
      # version and only re-resolves the SDK entry. (`cargo update -p` would be
      # wrong twice over: it errors on the orphaned path entry, and it
      # re-unifies wide-ranged transitive deps into a graph the committed lock
      # never tested.) A lock that already satisfies the pin — registry source
      # AND matching version — is used byte-for-byte as committed.
      - name: Reconcile Cargo.lock with the published SDK
        run: |
          set -euo pipefail
          pin=$(grep -E '^cardanowall = "=' Cargo.toml | head -1 | sed -E 's/.*"=([^"]+)".*/\1/')
          if [ -z "$pin" ]; then
            echo "::error::could not read the exact cardanowall pin from Cargo.toml"
            exit 1
          fi
          entry=$(grep -A 2 '^name = "cardanowall"$' Cargo.lock || true)
          lock_version=$(printf '%s\n' "$entry" | grep '^version = ' | head -1 | sed -E 's/version = "([^"]+)"/\1/' || true)
          if printf '%s\n' "$entry" | grep -q '^source = "registry+' && [ "$lock_version" = "$pin" ]; then
            echo "Cargo.lock already resolves cardanowall $pin from crates.io; leaving it untouched."
          else
            echo "Cargo.lock entry (version ${lock_version:-none}) does not satisfy the =$pin registry pin; reconciling."
            cargo fetch
          fi

      # ---- Gates: the standalone CI suite, re-run as release-blockers ----------
      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (full suite)
        run: cargo test --all-features

      # ---- Publish to crates.io (OIDC trusted-publishing; token bootstrap) ------
      # Mint a short-lived (30-minute) registry token from this job's OIDC
      # identity via the official action. Skipped (a) during the bootstrap phase
      # when a CARGO_REGISTRY_TOKEN secret is set (the crate must exist before a
      # Trusted Publisher can be configured), and (b) on a dry-run, since
      # `cargo publish --dry-run` uploads nothing and needs no token — so a
      # dry-run works before any crates.io Trusted Publisher exists.
      - name: Exchange OIDC for a crates.io token
        id: auth
        if: ${{ env.BOOTSTRAP_CARGO_TOKEN == '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') }}
        uses: rust-lang/crates-io-auth-action@v1.0.4

      - name: Publish `cardanowall-cli` to crates.io (dry-run on workflow_dispatch)
        env:
          # Prefer the bootstrap secret when present; otherwise use the OIDC token
          # minted above. Exactly one is non-empty.
          CARGO_REGISTRY_TOKEN: ${{ env.BOOTSTRAP_CARGO_TOKEN || steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            # A dispatch dry-run resolves the SDK pin from the registry like any
            # other build, so run it only when the pinned version is already
            # live on crates.io.
            echo "Dry-run: cargo publish --dry-run --allow-dirty"
            cargo publish --dry-run --allow-dirty
          else
            # The lock reconcile above may have rewritten Cargo.lock, dirtying
            # the fresh checkout. --allow-dirty permits exactly that expected
            # update — cargo still runs the full verify build.
            cargo publish --allow-dirty
          fi

      - name: Notice — binaries, Release, and image are tag-only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "::notice::workflow_dispatch stops after the publish job. The prebuilt binaries, the GitHub Release, and the GHCR image all compile against the published cardanowall SDK at this exact version, which a dry-run of an unpublished version cannot fetch from crates.io; they run only on a real version-tag push."

  # ---- Prebuilt binaries (native runners — no cross-compilation, no QEMU) ----
  build-binaries:
    name: Binary (${{ matrix.target }})
    needs: publish
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are musl-static: one self-contained binary per
          # architecture that runs on any distro, glibc or not.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # macos-15-intel is GitHub's current Intel runner line (macos-13 and
          # the plain macos-14/15 Intel labels are retired).
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain + target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: ${{ contains(matrix.target, '-musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # Same lockstep window (and the same gate) as the publish job: only touch
      # the lock when its SDK entry does not satisfy the exact registry pin
      # (missing registry source, or a stale registry entry at another
      # version), and then only via cargo's conservative resolve. The SDK is
      # live by now — the publish job waited for it.
      - name: Reconcile Cargo.lock with the published SDK
        shell: bash
        run: |
          set -euo pipefail
          pin=$(grep -E '^cardanowall = "=' Cargo.toml | head -1 | sed -E 's/.*"=([^"]+)".*/\1/')
          if [ -z "$pin" ]; then
            echo "::error::could not read the exact cardanowall pin from Cargo.toml"
            exit 1
          fi
          entry=$(grep -A 2 '^name = "cardanowall"$' Cargo.lock || true)
          lock_version=$(printf '%s\n' "$entry" | grep '^version = ' | head -1 | sed -E 's/version = "([^"]+)"/\1/' || true)
          if printf '%s\n' "$entry" | grep -q '^source = "registry+' && [ "$lock_version" = "$pin" ]; then
            echo "Cargo.lock already resolves cardanowall $pin from crates.io; leaving it untouched."
          else
            echo "Cargo.lock entry (version ${lock_version:-none}) does not satisfy the =$pin registry pin; reconciling."
            cargo fetch
          fi

      - name: Build (${{ matrix.target }})
        run: cargo build --release --locked --target ${{ matrix.target }}

      # cardanowall-v<version>-<target>.tar.gz (unix) / .zip (windows), each
      # containing a directory of the same name with the binary + LICENSE +
      # README. The version comes from the tag, already asserted equal to the
      # crate version by the publish job.
      - name: Package archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.publish.outputs.version }}"
          target="${{ matrix.target }}"
          stage="cardanowall-v$version-$target"
          mkdir "$stage"
          if [[ "$target" == *windows* ]]; then
            bin="cardanowall.exe"
          else
            bin="cardanowall"
          fi
          cp "target/$target/release/$bin" LICENSE README.md "$stage/"
          if [[ "$target" == *windows* ]]; then
            archive="$stage.zip"
            7z a "$archive" "$stage"
          else
            archive="$stage.tar.gz"
            tar -czf "$archive" "$stage"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: cardanowall-${{ matrix.target }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error

  # ---- GitHub Release: archives + SHA256SUMS ---------------------------------
  release:
    needs: [publish, build-binaries]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: cardanowall-*
          merge-multiple: true
          path: dist

      # One manifest over all five archives; a consumer verifies a download
      # with `grep <archive> SHA256SUMS | sha256sum -c -`.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Label 309 CLI ${{ github.ref_name }}'
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.publish.outputs.is_prerelease }}
          files: |
            dist/*

  # ---- Multi-arch GHCR image --------------------------------------------------
  # Same shape as the label-309-gateway image release. Runs only on a real
  # version tag (the image compiles against the just-published SDK, exactly like
  # the binaries), so unlike a dry-run-capable image job the version and the
  # push are unconditional here.
  image:
    needs: publish
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # A QEMU-emulated arm64 Rust release build is slow; give the multi-arch
    # build room while still capping the job.
    timeout-minutes: 120
    permissions:
      contents: read
      # packages: write lets GITHUB_TOKEN push the image to this repo's GHCR namespace.
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/label-309-cli
    steps:
      - uses: actions/checkout@v6

      # A final release moves `latest`; a pre-release (vX.Y.Z-rc.1) is published
      # under its exact tag only. The git tag's `v` prefix is dropped per Docker
      # convention.
      - name: Derive image tags
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$version"
            if [[ "$version" != *-* ]]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
